name: tests

on:
  push:
  pull_request:

jobs:
  # Windows is the product's target platform, so this stays the acceptance job
  # and its name is unchanged.
  #
  # No run has executed since 2026-09-10. Every attempt, on either runner type,
  # ends in two to four seconds with runner_id=0, an empty step list, a 404 for
  # its logs and zero billable milliseconds: the job is refused before a runner
  # is ever assigned. That is an account-level result, not a code result, and it
  # cannot be fixed from this file. On a private repository it is what an
  # exhausted Actions allowance or a spending limit of zero looks like - see
  # https://github.com/settings/billing. windows-latest bills at 2x and
  # ubuntu-latest at 1x, so the Linux job below also stretches that allowance.
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}\src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      # Compile every tracked module rather than a hand-listed subset: the list
      # went stale whenever a module was added, renamed or deleted.
      - name: Compile all modules
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest -q src\tests

  # A second runner, at half the minute cost, so a result exists as soon as the
  # allowance above allows any job to start. The suite is stdlib-only and the
  # desktop tests open actual Tk windows under Xvfb here; they skip cleanly when
  # a Python has no Tk at all. This does not replace native Windows acceptance -
  # it makes "no runner ran" distinguishable from "the tests failed".
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tk, a virtual display and the test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tk xvfb
          python -m pip install pytest
      - name: Report whether the UI tests can run here
        run: |
          python - <<'PY'
          try:
              import tkinter
          except ImportError as exc:
              print("no Tk (%s) - desktop tests will skip" % exc)
          else:
              print("Tk %s - desktop tests will run" % tkinter.TkVersion)
          PY
      - name: Compile all modules
        run: python -m compileall -q src
      - name: Run tests
        run: xvfb-run -a python -m pytest -q src/tests
